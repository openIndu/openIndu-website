name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.0
          git /repo --redact=100 --verbose

  validate-submodules:
    name: Validate submodule references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check .gitmodules config and submodule SHAs
        run: |
          echo "=== .gitmodules ===" && cat .gitmodules
          echo "=== submodule SHAs registered in tree ===" && git submodule status

  validate-compose:
    name: Validate docker-compose.yml syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: YAML syntax check
        run: |
          python3 -c "
          import yaml, sys
          with open('docker-compose.yml') as f:
              yaml.safe_load(f)
          print('docker-compose.yml is valid YAML')
          "
