services:
  # ============================================================
  # Infrastructure
  # ============================================================

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: openindu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: openindu_backend
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openindu -d openindu_backend"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO — only used by Milvus for internal vector index storage.
  # Not exposed to the host; business files use STORAGE_BACKEND (local / s3).
  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    expose:
      - "9000"
    volumes:
      - minio_data:/data

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd

  milvus:
    image: milvusdb/milvus:v2.4.10
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      - etcd
      - minio

  # ============================================================
  # Backend Services
  # ============================================================

  web-api:
    build:
      context: ./openIndu-backend
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              driver: nvidia
              count: 1
    command: uvicorn app.web_app:app --host 0.0.0.0 --port 8004 --reload
    env_file: .env
    environment:
      - HF_HOME=/models/huggingface
      - HF_HUB_OFFLINE=1
    ports:
      - "8004:8004"
    volumes:
      - ./openIndu-backend:/app
      - file_data:/data/files
      - ./models:/models
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_started

  mcp-api:
    build:
      context: ./openIndu-backend
    command: uvicorn app.mcp_app:app --host 0.0.0.0 --port 8005 --reload
    env_file: .env
    environment:
      # MCP 检索工具走 BGE-M3 向量化，复用聚合仓 ./models 缓存（与 web-api 一致）；
      # 强制离线，避免每次首查向 huggingface.co 发 HEAD 在国内超时拖慢检索。
      - HF_HOME=/models/huggingface
      - HF_HUB_OFFLINE=1
    ports:
      - "8005:8005"
    volumes:
      - ./openIndu-backend:/app
      - ./models:/models
    depends_on:
      - milvus

  # ============================================================
  # Frontend Services
  # ============================================================

  portal:
    build:
      context: ./openIndu-portal
    ports:
      - "3000:80"
    depends_on:
      - web-api

  admin:
    build:
      context: ./openIndu-admin
    ports:
      - "3001:80"
    depends_on:
      - web-api

  # ============================================================
  # Init: create default admin user
  # ============================================================

  init-admin:
    image: curlimages/curl:latest
    depends_on:
      web-api:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Waiting for web-api to be ready..."
        for i in $$(seq 1 30); do
          if curl -s http://web-api:8004/api/v1/health > /dev/null 2>&1; then
            echo "Web API is ready!"
            break
          fi
          echo "  Attempt $$i/30 - waiting..."
          sleep 3
        done
        echo ""
        echo "=== Registering admin user (phone: 13800000000) ==="
        curl -s -X POST http://web-api:8004/api/v1/auth/register \
          -H "Content-Type: application/json" \
          -d '{"phone":"13800000000","code":"888888"}'
        echo ""
        echo "=== Admin user registration complete ==="
    restart: "no"

volumes:
  postgres_data:
  minio_data:
  etcd_data:
  milvus_data:
  file_data:
